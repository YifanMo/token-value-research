creases your chances of liquidation.\",\"feedback-wallet-address-label\":\"Wallet address(optional)\",\"feedback-discord-placeholder\":\"Leave your email if you’d like the option of a reply\",\"feedback-discord-label\":\"Discord(optional)\",\"feedback-wallet-address-placeholder\":\"Please input your wallet address.\",\"airdrop-current-epoch-ranking\":\"Ranking\",\"airdrop-current-epoch-share\":\"Your share\",\"airdrop-current-epoch-max\":\"max\",\"airdrop-current-epoch-overview-desc\":\"Notice: Aster does not encourage hedging or wash trading to farm points. Each point category carries its own weighting to ensure balanced rewards. Adjustments may be applied to farmed points to maintain fairness — displayed points may not reflect the final allocation.\",\"airdrop-current-epoch-totalRh\":\"Current points\",\"airdrop-current-epoch-desc-totalRh\":\"Includes trade, position, profit, loss, and USDF/asBNB points. Updated hourly, except for position, USDF/asBNB, and referral points.\",\"airdrop-current-epoch-positionRh\":\"Position points\",\"airdrop-current-epoch-desc-positionRh\":\"Based on holding time and position size. Updated daily.\",\"airdrop-current-epoch-profitRh\":\"Profit points\",\"airdrop-current-epoch-desc-profitRh\":\"Based on net profit from the past hour. Updated hourly.\",\"airdrop-current-epoch-lossRh\":\"Loss points\",\"airdrop-current-epoch-desc-lossRh\":\"Based on net loss from the past hour. Updated hourly.\",\"airdrop-current-epoch-tvRh\":\"Trade points\",\"airdrop-current-epoch-desc-tvRh\":\"Trade Points are now calculated based on your trading fee contribution, liquidity (maker order) contribution and symbol boost factor.Updated hourly.\",\"airdrop-current-epoch-marginAssetRh\":\"USDF/asBNB points\",\"airdrop-current-epoch-desc-marginAssetRh\":\"Based on margin size and the proportion of USDF/asBNB in your portfolio. Updated daily.\",\"airdrop-current-epoch-rhSources\":\"Referral points\",\"airdrop-current-epoch-desc-rhSources\":\"Based on the total points of your invitees and their invitees. Points earned from first-level invitees are higher than those from second-level invitees.Updated daily.\",\"airdrop-current-epoch-stage4-totalRh\":\"Current points\",\"airdrop-current-epoch-desc-stage4-totalRh\":\"Includes trade, position, profit, loss, liquidation points and Aster Assets points, Updated hourly. Except for position, Aster Assets points, and referral points.\",\"airdrop-current-epoch-stage4-marginAssetRh\":\"Aster Assets points\",\"airdrop-current-epoch-desc-stage4-marginAssetRh\":\"Based on margin size and the proportion of Aster/USDF/asBNB in your portfolio. Updated daily.\",\"aridrop-stage3-faq-q1\":\"What are Rh points?\",\"aridrop-stage3-faq-a1\":\"Rh points are airdrop points earned from trading on Aster. They count toward your $ASTER airdrop allocation.\",\"aridrop-stage3-faq-a2\":\"Points = (Trade points +Position points + USDF/asBNB points + Profit points + Loss points) × Team boost + Referral points \u003cGitLink\u003eLearn more on GitBook\u003c/GitLink\u003e\",\"aridrop-stage3-faq-q2\":\"How are points calculated?\",\"aridrop-stage3-faq-q3\":\"Does a higher score always mean a bigger airdrop?\",\"aridrop-stage3-faq-a3\":\"Aster does not encourage hedging or wash trading to farm points. To ensure fairness, adjustments are applied to farmed points; points shown may not reflect final allocation.\",\"aridrop-stage3-faq-q4\":\"How are trade points calculated？\",\"aridrop-stage3-faq-a4\":\"In Season 3, both spot and perpetuals trading are counted. \u003cbr/\u003e\u003cbr/\u003eTrade Points are now calculated based on your trading fee contribution, liquidity (maker order) contribution and symbol boost factor.Updated hourly.\u003cbr/\u003e\u003cbr/\u003e\",\"aridrop-stage3-faq-q5\":\"What is Symbol Boost on Trade Points?\",\"aridrop-stage3-faq-a5\":\"It’s a limited-time boost on \u003cbold\u003eTrade Points\u003c/bold\u003e for ASTER-designated symbols.\u003cbr/\u003e\u003cbr/\u003eTrade the eligible symbols to receive an extra multiplier on your \u003cbold\u003eTrade Points\u003c/bold\u003e\u003cbr/\u003e\u003cbr/\u003eYour \u003cbold\u003efinal Trade Points\u003c/bold\u003e will be equal to your \u003cbold\u003eprevious Trade Points\u003c/bold\u003e multiplied by the symbol’s boost factor. \u003cbr/\u003e\u003cbr/\u003eOnly the Trade Points generated from trading the boosted symbol will receive this multiplier — others will remain unchanged.\",\"aridrop-stage3-faq-q6\":\"How are position points calculated?\",\"aridrop-stage3-faq-a6\":\"Based on both the duration and size of your positions. Aster does not encourage long-term hedging positions to farm points. To ensure fairness, adjustments are applied to farmed points; points shown may not reflect final allocation.\",\"aridrop-stage3-faq-q7\":\"How are USDF/asBNB points calculated?\",\"aridrop-stage3-faq-a7\":\"Based on the margin size (only in cross-margin mode) when opening positions each day, and on the proportion of asBNB or USDF in your portfolio. The larger your margin and the higher your share of Aster assets, the more points you earn.\",\"aridrop-stage3-faq-q8\":\"How are profit and loss points calculated?\",\"aridrop-stage3-faq-a8\":\"Points are based on your net profit or loss each hour. The timing follows the schedule shown on this page. Do not attempt to game the system by closing offsetting positions right before and after the hourly cutoff to double-count profit and loss points. Doing so may delay your points from being added.\",\"aridrop-stage3-faq-q9\":\"How does the referral bonus work?\",\"aridrop-stage3-faq-a9\":\"Based on the total points of your invitees and their invitees. \u003cbr/\u003ePoints earned from first-level invitees are higher than those from second-level invitees.Updated daily.\",\"aridrop-stage3-faq-q10\":\"How does team boost work?\",\"aridrop-stage3-faq-a10\":\"When a team’s cumulative points reach a certain threshold, the team unlocks a boost multiplier. The boost takes effect a few hours after joining a team. In Season 3, team boosts accumulate throughout the campaign and do not reset.\",\"aridrop-stage4-faq-a2\":\"Points = (Trade points +Position points + Aster Assets points + Liquidation points +Profit points + Loss points) × Team boost + Referral points. \u003cGitStage4Link\u003eLearn more on GitBook\u003c/GitStage4Link\u003e\",\"aridrop-stage4-faq-q2\":\"How are points calculated?\",\"aridrop-stage4-faq-q3\":\"Does a higher score always mean a bigger airdrop?\",\"aridrop-stage4-faq-a3\":\"Aster does not encourage hedging or wash trading to farm points. To ensure fairness, adjustments are applied to farmed points; points shown may not reflect final allocation.\",\"aridrop-stage4-faq-q4\":\"How are trade points calculated？\",\"aridrop-stage4-faq-a4\":\"In Stage 4, both spot and perpetuals trading are counted. \u003cbr/\u003e\u003cbr/\u003eTrade Points are now calculated based on your trading fee contribution, liquidity (maker order) contribution and symbol boost factor.Updated hourly.\",\"aridrop-stage4-faq-q5\":\"What is Symbol Boost on Trade Points?\",\"aridrop-stage4-faq-a5\":\"It’s a limited-time boost on \u003cbold\u003eTrade Points\u003c/bold\u003e for ASTER-designated symbols.\u003cbr/\u003e\u003cbr/\u003eTrade the eligible symbols to receive an extra multiplier on your \u003cbold\u003eTrade Points\u003c/bold\u003e\u003cbr/\u003e\u003cbr/\u003eYour \u003cbold\u003efinal Trade Points\u003c/bold\u003e will be equal to your \u003cbold\u003eprevious Trade Points\u003c/bold\u003e multiplied by the symbol’s boost factor. \u003cbr/\u003e\u003cbr/\u003eOnly the Trade Points generated from trading the boosted symbol will receive this multiplier — others will remain unchanged.\",\"aridrop-stage4-faq-q6\":\"How are position points calculated?\",\"aridrop-stage4-faq-a6\":\"Based on both the duration and size of your positions. Aster does not encourage long-term hedging positions to farm points.\",\"aridrop-stage4-faq-q7\":\"How are Aster Assets points calculated?\",\"aridrop-stage4-faq-a7\":\"Based on the margin size (only in cross-margin mode) when opening positions each day, and on the proportion of Aster/asBNB/USDF in your portfolio. The larger your margin and the higher your share of Aster assets, the more points you earn.\",\"aridrop-stage4-faq-q8\":\"How are profit and loss points calculated?\",\"aridrop-stage4-faq-a8\":\"Points are based on your net profit or loss each hour. The timing follows the schedule shown on this page. Do not attempt to game the system by closing offsetting positions right before and after the hourly cutoff to double-count profit and loss points. Doing so may delay your points from being added.\",\"aridrop-stage4-faq-q9\":\"How does the referral bonus work?\",\"aridrop-stage4-faq-a9\":\"Based on the total points of your invitees and their invitees. \u003cbr/\u003ePoints earned from first-level invitees are higher than those from second-level invitees.Updated daily.\",\"aridrop-stage4-faq-q10\":\"How does team boost work?\",\"aridrop-stage4-faq-a10\":\"When a team’s cumulative points reach a certain threshold, the team unlocks a boost multiplier. The boost takes effect a few hours after joining a team. In Stage 4, team boosts accumulate throughout the campaign and do not reset.\",\"airdrop-team-boost-desc-stage4\":\"Your team boost is based on your team’s combined activity across Trade points, Position points,  Aster Assets points, Profit points and Loss points, and accumulate over Stage 4.\",\"airdrop-next-team-boost-desc-stage4\":\"Team boost accumulates throughout Stage 4 and is not reset.\",\"trading-leaderboard-period-h24\":\"24h\",\"trading-leaderboard-period-d7\":\"7D\",\"trading-leaderboard-period-d14\":\"14D\",\"trading-leaderboard-period-d30\":\"30D\",\"perp-market-off-hours-trading-tip-stock\":\"This stock is currently trading outside regular hours, with limited price movement and potential reduced liquidity.\",\"perp-market-off-hours-trading-tip-commoditie et\",\"protect-your-wallet-message\":\"Set up your authenticator app to ensure your account's security.\",\"back\":\"Back\",\"enter-verification-code\":\"Enter verification code\",\"success\":\"Success\",\"not-now\":\"Not now\",\"done\":\"Done\",\"enter-6-digit-code-instruction\":\"To continue, enter the 6-digit code generated from your authenticator app\",\"enroll-in-mfa\":\"Enroll in MFA\",\"perp-userinfo-openOrders-linked-order\":\"Linked OCO order\",\"perp-openOrder-type-DELEVERAGE\":\"Deleveraging\",\"rocket-launch-cys-notes-1-v2\":\"Rewards are distributed based on each eligible participant's share of \u003chighlight\u003ethe total buy-order trading fees\u003c/highlight\u003e generated by all eligible participants. A participant's share is calculated as their individual buy-order fees divided by the total buy-order fees of the group. No participant may receive more than \u003chighlight\u003e3%\u003c/highlight\u003e of the total prize pool. Only reward amounts equal to or greater than \u003chighlight\u003e1 ASTER or 1 CYS\u003c/highlight\u003e will be distributed.\",\"rocket-launch-cys-notes-2-v2\":\"Participants are required to hold a minimum of \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e on Aster only (across their Spot and Perpetual accounts) throughout the entire period from \u003chighlight\u003e{{startDate}}\u003c/highlight\u003e to \u003chighlight\u003e{{endDate}}\u003c/highlight\u003e. Only $ASTER held on Aster counts - tokens in private wallets, on other exchanges, or third-party platforms are not counted. Random snapshots will be taken continuously to verify eligibility.\",\"rocket-launch-cys-notes-3-v2\":\"If the \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e balance is only reached after the campaign starts, falls below \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e at any point (even momentarily), or is withdrawn/sold before the end date, the participant will be disqualified.\",\"rocket-launch-cys-notes-4-v2\":\"The $50,000 prize pool will be used to purchase $ASTER on the open market the day before distribution; the $ASTER price on that day will be used for reward calculations.\",\"rocket-launch-cys-notes-5-v2\":\"A bonus $CYS airdrop will also be distributed. The total amount and individual allocation of $CYS is at Aster's sole discretion.\",\"rocket-launch-cys-notes-6-v2\":\"The campaign is open to all new and existing Aster users, excluding market makers.\",\"remove-mfa\":\"Remove MFA\",\"perp-userinfo-tradeHistory-header-order-price\":\"Order price\",\"perp-userinfo-tradeHistory-header-executed\":\"Executed\",\"perp-userinfo-tradeHistory-header-trade-value\":\"Trade value\",\"perp-userinfo-tradeHistory-header-role\":\"Role\",\"perp-userinfo-tradeHistory-role-maker\":\"Maker\",\"perp-userinfo-tradeHistory-role-taker\":\"Taker\",\"verify-ownership-title\":\"Verify ownership\",\"verify-ownership-description\":\"Your wallet is connected, but the signature session has expired. Please sign again to verify ownership.\",\"verify-ownership-possible-reasons\":\"Possible reasons for this issue:\",\"verify-ownership-possible-reason-1\":\"Logged in from another browser or device\",\"verify-ownership-possible-reason-2\":\"Browser cleared local storage\",\"verify-ownership-signing-free\":\"Signing is free and won't cost gas\",\"verify-ownership-verify\":\"Verify\",\"rocket-launch-template-v1-notes-1\":\"Rewards are distributed based on each eligible participant's share of \u003chighlight\u003ethe total buy-order trading fees\u003c/highlight\u003e generated by all eligible participants. A participant's share is calculated as their individual buy-order fees divided by the total buy-order fees of the group. No participant may receive more than \u003chighlight\u003e3%\u003c/highlight\u003e of the total prize pool. Only reward amounts equal to or greater than \u003chighlight\u003e1 ASTER or 1 {{baseAsset}}\u003c/highlight\u003e will be distributed.\",\"rocket-launch-template-v1-notes-2\":\"Participants are required to hold a minimum of \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e on Aster only (across their Spot and Perpetual accounts) throughout the entire period from \u003chighlight\u003e{{startDate}}\u003c/highlight\u003e to \u003chighlight\u003e{{endDate}}\u003c/highlight\u003e. Only $ASTER held on Aster counts - tokens in private wallets, on other exchanges, or third-party platforms are not counted. Random snapshots will be taken continuously to verify eligibility.\",\"rocket-launch-template-v1-notes-3\":\"If the \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e balance is only reached after the campaign starts, falls below \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e at any point (even momentarily), or is withdrawn/sold before the end date, the participant will be disqualified.\",\"rocket-launch-template-v1-notes-4\":\"The $50,000 prize pool will be used to purchase $ASTER on the open market the day before distribution; the $ASTER price on that day will be used for reward calculations.\",\"rocket-launch-template-v1-notes-5\":\"A bonus ${{baseAsset}} airdrop will also be distributed. The total amount and individual allocation of ${{baseAsset}} is at Aster's sole discretion.\",\"rocket-launch-template-v1-notes-6\":\"The campaign is open to all new and existing Aster users, excluding market makers.\",\"rocket-launch-template-v3-notes-4\":\"The $200,000 prize pool will be used to purchase $ASTER on the open market the day before distribution; the $ASTER price on that day will be used for reward calculations.\",\"header-1001x-moved-to-here\":\"1001x moved to here\",\"builder-about-title\":\"Building a Permissionless Perpetual Exchange\",\"builder-about-description\":\"The Builder Center is a dedicated revenue dashboard for Aster Code ecosystem contributors. Become a Builder to unlock real-time monitoring of your performance data and earnings.\",\"builder-about-become-builder-button\":\"Become Builder\",\"builder-about-why-choose-us\":\"Why Choose Us\",\"builder-about-permissionless-title\":\"Permissionless\",\"builder-about-permissionless-description\":\"Skip the bureaucratic application forms and approval wait times. Simply activate your Aster Code and start building immediately. We believe in open access for every contributor.\",\"builder-about-rewards-title\":\"Lucrative Builder Rewards\",\"builder-about-rewards-description\":\"Turn trading volume into a continuous revenue stream. Our transparent fee structure ensures you earn a substantial share of the trading fees generated through your code, settled daily.\",\"builder-about-dex-engine-title\":\"High-Performance DEX Engine\",\"builder-about-dex-engine-description\":\"Back your community with the best. Aster provides a stable, lightning-fast, and competitive trading experience that rivals centralized exchanges, ensuring your users stay and trade.\",\"builder-about-build-brand-title\":\"Build Your Own Brand\",\"builder-about-build-brand-description\":\"Don't just be a referrer; be a founder. Leverage our deep liquidity and infrastructure to create a unique trading experience and interface that carries your own brand identity.\",\"builder-about-partners\":\"Our partners\",\"metadata-title-builder-about\":\"Building a Permissionless Perpetual Exchange\",\"remove-authenticator-app\":\"Remove Authenticator App\",\"disabling-mfa-weakens-your-account-security\":\"Disabling MFA weakens your account security. Are you sure you want to continue?\",\"authenticator-app-verification-removed\":\"Authenticator app verification removed\",\"authenticator-app-verification-added\":\"Authenticator app verification added\",\"aridrop-stage5-faq-a2\":\"Points = (Trade points +Position points + Aster Assets points + Liquidation points +Profit points + Loss points) × Team boost + Referral points. \u003cGitStage5Link\u003eLearn more on GitBook\u003c/GitStage5Link\u003e\",\"aridrop-stage5-faq-q2\":\"How are points calculated?\",\"aridrop-stage5-faq-q3\":\"Does a higher score always mean a bigger airdrop?\",\"aridrop-stage5-faq-a3\":\"Aster does not encourage hedging or wash trading to farm points. To ensure fairness, adjustments are applied to farmed points; points shown may not reflect final allocation.\",\"aridrop-stage5-faq-q4\":\"How are trade points calculated？\",\"aridrop-stage5-faq-a4\":\"In Stage 5, both spot and perpetuals trading are counted.\u003cbr/\u003e\u003cbr/\u003eTrade Points are now calculated based on your trading fee contribution, liquidity (maker order) contribution and symbol boost factor. Updated hourly.\",\"aridrop-stage5-faq-q5\":\"What is Symbol Boost on Trade Points?\",\"aridrop-stage5-faq-a5\":\"It’s a limited-time boost on \u003cbold\u003eTrade Points\u003c/bold\u003e for ASTER-designated symbols.\u003cbr/\u003e\u003cbr/\u003eTrade the eligible symbols to receive an extra multiplier on your \u003cbold\u003eTrade Points\u003c/bold\u003e.\u003cbr/\u003e\u003cbr/\u003eYour \u003cbold\u003efinal Trade Points\u003c/bold\u003e will be equal to your \u003cbold\u003eprevious Trade Points\u003c/bold\u003e multiplied by the symbol’s boost factor. \u003cbr/\u003e\u003cbr/\u003eOnly the Trade Points generated from trading the boosted symbol will receive this multiplier — others will remain unchanged.\",\"aridrop-stage5-faq-q6\":\"How are position points calculated?\",\"aridrop-stage5-faq-a6\":\"Based on both the duration and size of your positions. Aster does not encourage long-term hedging positions to farm points.\",\"aridrop-stage5-faq-q7\":\"How are Aster Assets points calculated?\",\"aridrop-stage5-faq-a7\":\"Based on the margin size (only in cross-margin mode) when opening positions each day, and on the proportion of Aster/asBNB/USDF in your portfolio. The larger your margin and the higher your share of Aster assets, the more points you earn.\",\"aridrop-stage5-faq-q8\":\"How are profit and loss points calculated?\",\"aridrop-stage5-faq-a8\":\"Points are based on your net profit or loss each hour. The timing follows the schedule shown on this page. Do not attempt to game the system by closing offsetting positions right before and after the hourly cutoff to double-count profit and loss points. Doing so may delay your points from being added.\",\"aridrop-stage5-faq-q9\":\"How does the referral bonus work?\",\"aridrop-stage5-faq-a9\":\"Based on the total points of your invitees and their invitees. \u003cbr/\u003ePoints earned from first-level invitees are higher than those from second-level invitees.Updated daily.\",\"aridrop-stage5-faq-q10\":\"How does team boost work?\",\"aridrop-stage5-faq-a10\":\"When a team’s cumulative points reach a certain threshold, the team unlocks a boost multiplier. The boost takes effect a few hours after joining a team. In Stage 5, team boosts accumulate throughout the campaign and do not reset.\",\"aridrop-stage5-faq-q11\":\"Why my point is lower than others with similar trades?\",\"aridrop-stage5-faq-a11\":\"Aster encourage the user get points via normal trade, any abnormal operations include but not limited to brush trade will lead to a decrease of your point weight.\",\"aridrop-stage5-faq-q12\":\"How are liquidation points calculated?\",\"aridrop-stage5-faq-a12\":\"Liquidation Points are calculated from the insurance clear fees incurred at the time of liquidation. The more liquidation fees a user generates, the more Liquidation Points they receive. Updated hourly.\",\"airdrop-stage-subtitle-stage-5\":\"Crystal\",\"metadata-title-airdrop-stage-5\":\"Stage5 Crystal | Aster\",\"rocket-launch-rtx-notes-1\":\"Rewards are distributed based on each eligible participant’s share of \u003chighlight\u003ethe total buy-order trading fees\u003c/highlight\u003e generated by all eligible participants. A participant’s share is calculated as their individual buy-order fees divided by the total buy-order fees of the group. No participant may receive more than \u003chighlight\u003e3%\u003c/highlight\u003e of the total prize pool. Only reward amounts equal to or greater than \u003chighlight\u003e1 ASTER or 1 {{baseAsset}}\u003c/highlight\u003e will be distributed.\",\"rocket-launch-rtx-notes-2\":\"Participants are required to hold a minimum of \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e on Aster only (across their Spot and Perpetual accounts) throughout the entire period from \u003chighlight\u003e{{startDate}}\u003c/highlight\u003e to \u003chighlight\u003e{{endDate}}\u003c/highlight\u003e. Only $ASTER held on Aster counts — tokens in private wallets, on other exchanges, or third-party platforms are not counted. Random snapshots will be taken continuously to verify eligibility.\",\"rocket-launch-rtx-notes-3\":\"If the \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e balance is only reached after the campaign starts, falls below \u003chighlight\u003e444 $ASTER\u003c/highlight\u003e at any point (even momentarily), or is withdrawn/sold before the end date, the participant will be disqualified.\",\"rocket-launch-rtx-notes-4\":\"The $200,000 prize pool will be used to purchase $ASTER from the open market the day before distribution; the $ASTER price on that day will be used for reward calculations.\",\"rocket-launch-rtx-notes-5\":\"A bonus ${{baseAsset}} airdrop will also be distributed. The total amount and individual allocation of ${{baseAsset}} is at Aster's sole discretion.\",\"rocket-launch-rtx-notes-6\":\"The campaign is open to all new and existing Aster users, excluding market makers.\",\"shield-orderform-profitShareFee-tooltip-v2\":\"The fees are charged only on net profits. No fees are charged on losses.\",\"shield-orderform-profitShareFee-title\":\"Profit Share\",\"prep-orderform-twap-minutes\":\"min\",\"twap-status-working\":\"Working\",\"twap-status-new\":\"New\",\"twap-status-cancelled\":\"Cancelled\",\"twap-status-expired\":\"Expired\",\"twap-status-finished\":\"Finished\",\"rocket-launch-sentis-notes-1\":\"Rewards are distributed based on each eligible participant’s share of \u003chighlight\u003 es. Users holding USD1 in their Aster \u003cbold\u003eperpetual accounts\u003c/bold\u003e can earn \u003cbold\u003erewards\u003c/bold\u003e.\",\"airdrop-trade-usd1-faq-q7\":\"What are the USD1 Points?\",\"airdrop-trade-usd1-faq-a7\":\"The USD1 Points are \u003cbold\u003eearned\u003c/bold\u003e from USD1 Loyalty Program \u003cbold\u003eby trading USD1 perpetual pairs\u003c/bold\u003e on Aster. USD1 points are converted into \u003cbold\u003eWLFI token rewards\u003c/bold\u003e based on each user’s \u003cbold\u003eshare of the reward pool\u003c/bold\u003e.\",\"airdrop-trade-usd1-faq-q8\":\"What is the USD1 Loyalty Program?\",\"airdrop-trade-usd1-faq-a8\":\"Inspired by loyalty systems such as airline miles and hotel points, the \u003cbold\u003eUSD1 Loyalty Program\u003c/bold\u003e is designed to reward early adopters and accelerate adoption of USD1 across the ecosystem. Users will earn points based on their daily trading volume and engagement with USD1.\",\"airdrop-trade-usd1-epoch-tip\":\"Epoch\",\"airdrop-trade-usd1-amount\":\"WLFI Airdrop Amount\",\"airdrop-trade-usd1-history\":\"History\",\"airdrop-trade-usd1-time\":\"Rewards time\",\"aster-api-error-30000010\":\"Sub-account address must match your main account type (e.g. if main account is EVM, sub-account must be EVM).\",\"aster-api-error-30000011\":\"This account has been restricted. Please contact support.\",\"aster-api-error-30000012\":\"Nonce expired. Please try again.\",\"aster-api-error-30000013\":\"Verification failed. The signed account does not match this sub-account.\",\"aster-api-error-30000014\":\"This service is not available in your region.\",\"aster-api-error-30000015\":\"This sub-account already exists.\",\"aster-api-error-30000016\":\"Something went wrong. Please try again.\",\"aster-api-error-30000017\":\"This sub-account creation was already submitted. Please wait.\",\"aster-api-error-30000018\":\"Failed to create sub-account. Please try again.\",\"aster-api-error-30000019\":\"This sub-account na
