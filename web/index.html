<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="协议收入、回购去向、供应稀释与政策变更的本地研究框架。">
  <title>协议收入与代币价值 · 研究框架</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101b2c'/%3E%3Cpath d='M6 23h20M8 18v-5m8 5V7m8 11v-9' stroke='%23edc66d' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=32">
</head>
<body>
  <main>
    <header class="masthead">
      <div><h1>代币价值研究</h1><p id="snapshot-date">读取本地快照…</p></div>
      <nav aria-label="研究文档"><button id="metric-help">指标说明</button><a href="../research/report.md">研究报告</a></nav>
    </header>
    <div id="errors" role="status"></div>
    <section id="research-controls" aria-label="全页观察窗口" class="controls">
      <div class="control-main"><div class="period" role="group" aria-label="观察窗口"><span>观察窗口</span><button data-days="7">7天</button><button data-days="30" aria-pressed="true">30天</button><button data-days="90">90天</button><button id="more-history-toggle" aria-expanded="false" aria-controls="extended-periods">更多时间段</button><span id="extended-periods" hidden><button data-days="365">1年</button><button data-days="1095">3年</button><button data-days="1825">5年</button></span><button id="custom-range-toggle" aria-expanded="false" aria-controls="custom-range-form">自定义</button></div></div>
      <form id="custom-range-form" hidden><label>起始日期 <input id="range-start" name="start" type="date" required></label><label>结束日期 <input id="range-end" name="end" type="date" required></label><button type="submit">应用</button><button id="custom-range-cancel" type="button">收起</button></form>
      <p id="range-error" role="status"></p>
      <p id="range-context" class="range-context"></p>
    </section>
    <section class="comparison" aria-labelledby="compare-heading">
      <div class="section-title"><h2 id="compare-heading">协议收入、代币回购与估值对比 <span id="token-count"></span></h2><button id="reset-sort" hidden>默认顺序</button></div>
      <p id="sort-status" class="sr-only" role="status">点击表头排序；缺失或不适用置后。</p>
      <div class="table-wrap" id="comparison-scroll"><table><thead><tr>
        <th><button class="sort-header" data-sort="ticker" data-sort-label="代币名称" aria-label="按代币名称排序">代币 <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th><button class="sort-header" data-sort="marketCap" data-sort-label="流通市值" aria-label="按流通市值排序">流通市值 <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th><button class="sort-header" data-sort="fdv" data-sort-label="FDV" aria-label="按FDV排序">FDV <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th><button class="sort-header" data-sort="revenue" data-sort-label="协议所得收入" aria-label="按协议所得收入排序">协议收入 <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th><button class="sort-header" data-sort="yieldMc" data-sort-label="年化回购收益率 / 流通市值" aria-label="年化回购收益率按流通市值排序" title="年化回购／销毁统计金额 ÷ 流通市值">年化回购／销毁收益率 <span class="sort-direction" aria-hidden="true">↕</span></button><button class="sort-alternate" data-sort="yieldFdv" data-sort-label="年化回购收益率 / FDV" aria-label="年化回购收益率按FDV排序">按 FDV <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th id="financial-start" class="financial-col"><button class="sort-header" data-sort="psMc" data-sort-label="协议收入倍数 P/S / 流通市值" aria-label="P/S按流通市值排序" title="估值 ÷ 年化收入统计，未扣完整经营成本">P/S <span class="sort-direction" aria-hidden="true">↕</span></button><button class="sort-alternate" data-sort="psFdv" data-sort-label="协议收入倍数 P/S / FDV" aria-label="P/S按FDV排序">按 FDV <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th id="holder-pe-heading" class="financial-col"><button class="sort-header" data-sort="holderPeMc" data-sort-label="持币者回报倍数 / 流通市值" aria-label="持币者回报倍数按流通市值排序" title="参考P/E：估值 ÷ 年化回购／销毁统计，并非项目净利润P/E">持币者回报倍数 <span class="sort-direction" aria-hidden="true">↕</span></button><button class="sort-alternate" data-sort="holderPeFdv" data-sort-label="持币者回报倍数 / FDV" aria-label="持币者回报倍数按FDV排序">按 FDV <span class="sort-direction" aria-hidden="true">↕</span></button></th>
        <th class="overview-supply">未来365天释放</th>
        <th>来源</th>
      </tr></thead><tbody id="comparison-body"></tbody></table></div>
      <div class="table-caption"><span>USD · 点击数值查看详情</span><span>— 缺数据 / 不适用</span></div>
    </section>
    <section id="token-controls" aria-label="选择详情代币" class="controls token-controls">
      <h2>代币详情</h2><label for="token-selector"><span class="sr-only">查看代币</span><select id="token-selector" disabled><option value="">选择代币…</option></select></label><button id="close-detail" hidden>收起详情</button>
    </section>
    <section id="detail" aria-live="polite" hidden></section>
    <details class="supply-comparison"><summary>全部代币 · 供应对比</summary><section id="supply-overview" aria-labelledby="supply-heading"></section></details>
    <footer><span>Token Value Research</span><a href="../research/framework.md">完整计算口径 ↗</a></footer>
  </main>
  <dialog id="source-dialog" aria-labelledby="source-title">
    <div class="source-head"><div><span class="eyebrow">数据来源与计算过程</span><h2 id="source-title"></h2></div><button id="source-close" aria-label="关闭数据来源">关闭</button></div>
    <div id="source-content" aria-live="polite"></div>
  </dialog>
  <script type="module" src="./app.js?v=33"></script>
</body>
</html>
